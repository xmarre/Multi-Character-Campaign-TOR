name: Materialize staged feature branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.1.0-battle-intervention
          fetch-depth: 0

      - name: Decode, validate, and materialize payload
        shell: bash
        run: |
          set -euo pipefail
          payload=/tmp/mcc-final-payload.tar.xz
          out=/tmp/mcc-materialized
          cat .bootstrap/final-payload.tar.xz.b64/part-*.txt | base64 --decode > "$payload"
          xz --test "$payload"
          mkdir -p "$out"
          tar -xJf "$payload" -C "$out"

          src="$out"
          if [[ ! -d "$src/Modules" ]]; then
            candidate="$(find "$src" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [[ -n "$candidate" && -d "$candidate/Modules" ]]; then
              src="$candidate"
            fi
          fi

          test -f "$src/Modules/MultiCharacterCampaignTOR/SubModule.xml"
          test -d "$src/Modules/MultiCharacterCampaignTOR/Source/CSharp"
          grep -RIl --include='*.cs' -E 'MapEvent|map event' "$src/Modules/MultiCharacterCampaignTOR/Source/CSharp" >/dev/null

          rsync -a --delete --exclude='.git/' "$src/" "$GITHUB_WORKSPACE/"
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'Payload produced no changes'; exit 1; }
          git commit -m "Materialize v1.1.0 source and release pipeline"
          git push origin HEAD:agent/v1.1.0-battle-intervention
