name: Restore truncated CareerAbilityRepair source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.1.0-battle-intervention
          fetch-depth: 0
      - name: Restore exact v1.0.41 tail
        shell: bash
        run: |
          cat >> src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/CareerAbilityRepair.cs <<'EOF'
			if (value == null)
			{
				return "<null>";
			}
			try
			{
				PropertyInfo propertyInfo = value.GetType().GetProperty("StringId", BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic) ?? value.GetType().GetProperty("StringID", BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic);
				object obj = ((!(propertyInfo == null)) ? propertyInfo.GetValue(value, null) : null);
				return (obj != null) ? Convert.ToString(obj) : value.GetType().FullName;
			}
			catch
			{
				return value.GetType().FullName;
			}
		}

		private static string Unwrap(Exception ex)
		{
			while (ex is TargetInvocationException && ex.InnerException != null)
			{
				ex = ex.InnerException;
			}
			return ex.ToString();
		}

		private static void Log(string message)
		{
			try
			{
				string text = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.Personal), "Mount and Blade II Bannerlord", "ModLogs");
				Directory.CreateDirectory(text);
				File.AppendAllText(Path.Combine(text, "MultiCharacterCampaignTOR.log"), DateTime.Now.ToString("yyyy-MM-dd HH:mm:ss.fff") + " [CareerAbilityFix132] " + message + Environment.NewLine);
			}
			catch
			{
			}
		}
	}
}
EOF
          rm .github/workflows/restore-career-source.yml
          test "$(wc -l < src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/CareerAbilityRepair.cs)" -eq 854
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore truncated runtime compatibility source"
          git push origin HEAD:agent/v1.1.0-battle-intervention
