name: Apply battle-intervention hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.1.0-battle-intervention
          fetch-depth: 0

      - name: Apply reviewed state and rollback fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          alert = Path('src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionAlert.cs')
          text = alert.read_text(encoding='utf-8')

          old = '''\t\tprivate static bool _installed;\n\t\tprivate static bool _inquiryOpen;\n\t\tprivate static object _pendingEncounterEvent;\n\t\tprivate static int _encounterDelayTicks;'''
          new = '''\t\tprivate static bool _installed;\n\t\tprivate static Campaign _campaign;\n\t\tprivate static bool _inquiryOpen;\n\t\tprivate static object _pendingEncounterEvent;\n\t\tprivate static int _encounterDelayTicks;'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''\t\tinternal static void Tick()\n\t\t{\n\t\t\tif (!_installed || Campaign.Current == null)\n\t\t\t{\n\t\t\t\treturn;\n\t\t\t}'''
          new = '''\t\tinternal static void Tick()\n\t\t{\n\t\t\tif (!_installed || !EnsureCampaignState())\n\t\t\t{\n\t\t\t\treturn;\n\t\t\t}'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''\t\tprivate static void AfterMapEventStarted(object __0)\n\t\t{\n\t\t\tif (__0 != null)\n\t\t\t{\n\t\t\t\tStartedEvents.Enqueue(__0);\n\t\t\t}\n\t\t}'''
          new = '''\t\tprivate static void AfterMapEventStarted(object __0)\n\t\t{\n\t\t\tif (__0 != null && EnsureCampaignState())\n\t\t\t{\n\t\t\t\tStartedEvents.Enqueue(__0);\n\t\t\t}\n\t\t}'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          marker = '''\t\tprivate static void ProcessStartedEvents()\n\t\t{'''
          insertion = '''\t\tprivate static bool EnsureCampaignState()\n\t\t{\n\t\t\tCampaign current = Campaign.Current;\n\t\t\tif (!object.ReferenceEquals(_campaign, current))\n\t\t\t{\n\t\t\t\tStartedEvents.Clear();\n\t\t\t\tCandidates.Clear();\n\t\t\t\tProcessedEvents.Clear();\n\t\t\t\tSuppressedEvents.Clear();\n\t\t\t\t_inquiryOpen = false;\n\t\t\t\t_pendingEncounterEvent = null;\n\t\t\t\t_encounterDelayTicks = 0;\n\t\t\t\t_campaign = current;\n\t\t\t}\n\t\t\treturn current != null;\n\t\t}\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, insertion + marker)
          alert.write_text(text, encoding='utf-8')

          remote = Path('src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/RemotePartySwitch.cs')
          text = remote.read_text(encoding='utf-8')

          old = '''\t\t\treturn CanUseRemoteParty(behavior, target, false, expectedMapEvent, out reason);\n\t\t}\n\n\t\tinternal static bool TakeControlForBattle'''
          new = '''\t\t\tif (!CanUseRemoteParty(behavior, target, false, expectedMapEvent, out reason))\n\t\t\t{\n\t\t\t\treturn false;\n\t\t\t}\n\t\t\treturn CanContinueBattleAsPlayer(expectedMapEvent, out reason);\n\t\t}\n\n\t\tprivate static bool CanContinueBattleAsPlayer(object expectedMapEvent, out string reason)\n\t\t{\n\t\t\treason = string.Empty;\n\t\t\ttry\n\t\t\t{\n\t\t\t\tif (expectedMapEvent == null)\n\t\t\t\t{\n\t\t\t\t\treason = "The defensive battle is no longer active.";\n\t\t\t\t\treturn false;\n\t\t\t\t}\n\t\t\t\tobject defenderParty = GetSideLeaderParty(GetMember(expectedMapEvent, "DefenderSide"));\n\t\t\t\tobject attackerParty = GetSideLeaderParty(GetMember(expectedMapEvent, "AttackerSide"));\n\t\t\t\tif (defenderParty == null || attackerParty == null)\n\t\t\t\t{\n\t\t\t\t\treason = "Bannerlord did not expose both battle-side leader parties.";\n\t\t\t\t\treturn false;\n\t\t\t\t}\n\t\t\t\tType encounterType = RequireType("TaleWorlds.CampaignSystem.Encounters.PlayerEncounter, TaleWorlds.CampaignSystem");\n\t\t\t\tMethodInfo restart = RequireMethod(encounterType, "RestartPlayerEncounter", 3, StaticFlags);\n\t\t\t\tParameterInfo[] parameters = restart.GetParameters();\n\t\t\t\tif (parameters.Length != 3 || parameters[2].ParameterType != typeof(bool))\n\t\t\t\t{\n\t\t\t\t\treason = "Bannerlord's player-encounter restart signature is incompatible.";\n\t\t\t\t\treturn false;\n\t\t\t\t}\n\t\t\t\tRequireMethod(encounterType, "Init", 0, StaticFlags);\n\t\t\t\tRequireMethod(encounterType, "Start", 0, StaticFlags);\n\t\t\t\treturn true;\n\t\t\t}\n\t\t\tcatch (Exception ex)\n\t\t\t{\n\t\t\t\tException unwrapped = Unwrap(ex);\n\t\t\t\treason = unwrapped.Message;\n\t\t\t\tLogError("[BattleIntervention] Native player-encounter API validation failed", unwrapped);\n\t\t\t\treturn false;\n\t\t\t}\n\t\t}\n\n\t\tinternal static bool TakeControlForBattle'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''\t\t\ttry\n\t\t\t{\n\t\t\t\tMobileParty mainParty = MobileParty.MainParty;\n\t\t\t\tif (mainParty == null || expectedMapEvent == null || GetEffectiveMapEvent(mainParty) != expectedMapEvent)'''
          new = '''\t\t\ttry\n\t\t\t{\n\t\t\t\tif (!CanContinueBattleAsPlayer(expectedMapEvent, out reason))\n\t\t\t\t{\n\t\t\t\t\treturn false;\n\t\t\t\t}\n\t\t\t\tMobileParty mainParty = MobileParty.MainParty;\n\t\t\t\tif (mainParty == null || GetEffectiveMapEvent(mainParty) != expectedMapEvent)'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''\t\t\t\tLogError("[RemotePartySwitch] Remote switch failed", ex2);\n\t\t\t\tif (flag && (flag2 || (Hero.MainHero == target && MobileParty.MainParty == partyBelongedTo)))'''
          new = '''\t\t\t\tLogError("[RemotePartySwitch] Remote switch failed", ex2);\n\t\t\t\tif (flag && !flag2 && Hero.MainHero == target && MobileParty.MainParty == mainParty && mainHero != null && mainHero.IsAlive)\n\t\t\t\t{\n\t\t\t\t\ttry\n\t\t\t\t\t{\n\t\t\t\t\t\tSetPlayerTroop(mainHero);\n\t\t\t\t\t\tif (Hero.MainHero != mainHero || MobileParty.MainParty != mainParty)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\tthrow new InvalidOperationException("Pre-handoff rollback did not restore the original MainHero/MainParty pair.");\n\t\t\t\t\t\t}\n\t\t\t\t\t\tflag = false;\n\t\t\t\t\t\tLogInfo("[RemotePartySwitch] Rolled back PlayerTroop after campaign party rebinding failed before commit.");\n\t\t\t\t\t}\n\t\t\t\t\tcatch (Exception rollbackException)\n\t\t\t\t\t{\n\t\t\t\t\t\tLogError("[RemotePartySwitch] Pre-handoff PlayerTroop rollback failed", Unwrap(rollbackException));\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tif (flag && (flag2 || (Hero.MainHero == target && MobileParty.MainParty == partyBelongedTo)))'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          remote.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-hardening.yml').unlink()
          PY

          git diff --check
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden battle intervention state and rollback"
          git push origin HEAD:agent/v1.1.0-battle-intervention
