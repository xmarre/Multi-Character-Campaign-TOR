name: Harmony 2.4 compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Bannerlord references
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj

      - name: Resolve Bannerlord and Harmony 2.4.2 references
        shell: pwsh
        run: |
          $campaign = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaign) { throw 'Bannerlord reference assemblies were not restored.' }
          $bin = $campaign.Directory.FullName

          dotnet new classlib -n HarmonyResolver242 -o "$env:RUNNER_TEMP\HarmonyResolver242" -f netstandard2.0
          dotnet add "$env:RUNNER_TEMP\HarmonyResolver242\HarmonyResolver242.csproj" package Lib.Harmony --version 2.4.2
          dotnet restore "$env:RUNNER_TEMP\HarmonyResolver242\HarmonyResolver242.csproj"
          $harmony = Get-ChildItem "$env:USERPROFILE\.nuget\packages\lib.harmony\2.4.2" -Recurse -Filter 0Harmony.dll | Where-Object FullName -Match 'net472' | Select-Object -First 1
          if (-not $harmony) { throw 'Lib.Harmony 2.4.2 0Harmony.dll was not resolved.' }

          "BANNERLORD_BIN=$bin" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HARMONY_DLL=$($harmony.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build complete solution against Harmony 2.4.2
        shell: pwsh
        run: |
          dotnet restore src/MultiCharacterCampaignTOR.CSharp.sln -p:BannerlordBin="$env:BANNERLORD_BIN" -p:HarmonyDll="$env:HARMONY_DLL" -p:RuntimeHarmonyDll="$env:HARMONY_DLL"
          dotnet build src/MultiCharacterCampaignTOR.CSharp.sln -c Release --no-restore -p:BannerlordBin="$env:BANNERLORD_BIN" -p:HarmonyDll="$env:HARMONY_DLL" -p:RuntimeHarmonyDll="$env:HARMONY_DLL"

      - name: Guard Harmony bootstrap against loader-context regressions
        shell: pwsh
        run: |
          $harmonyBridge = Get-Content 'src/MultiCharacterCampaignTOR/MultiCharacterCampaignTOR/HarmonyBridge.cs' -Raw
          $careerBridge = Get-Content 'src/MultiCharacterCampaignTOR/MultiCharacterCampaignTOR/CareerUniquesBridge.cs' -Raw
          $nativeCreation = Get-Content 'src/NativeCreation/MultiCharacterCampaignTOR/NativeCreation/NativeCharacterCreation.cs' -Raw
          $linkedCareerRepair = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/LinkedCareerAbilityRepairInstaller.cs' -Raw

          foreach ($source in @($harmonyBridge, $careerBridge, $nativeCreation, $linkedCareerRepair)) {
            if ($source -match 'Type\.GetType\("HarmonyLib\.(Harmony|HarmonyMethod), 0Harmony"') {
              throw 'A directly controlled Harmony bootstrap regressed to assembly-qualified string lookup.'
            }
          }
          if ($harmonyBridge -notmatch 'typeof\(Harmony\)' -or $harmonyBridge -notmatch 'typeof\(HarmonyMethod\)') {
            throw 'HarmonyBridge does not bind Harmony types through the linked assembly.'
          }
          if ($careerBridge -notmatch 'typeof\(Harmony\)' -or $careerBridge -notmatch 'typeof\(HarmonyMethod\)') {
            throw 'CareerUniquesBridge does not bind Harmony types through the linked assembly.'
          }
          if ($nativeCreation -notmatch 'typeof\(Harmony\)' -or $nativeCreation -notmatch 'typeof\(HarmonyMethod\)' -or $nativeCreation -notmatch 'new Harmony\(HarmonyId\)') {
            throw 'NativeCreation does not bind Harmony through its linked 0Harmony reference.'
          }
          if ($linkedCareerRepair -notmatch 'new Harmony\(' -or $linkedCareerRepair -notmatch 'new HarmonyMethod\(' -or $linkedCareerRepair -notmatch 'typeof\(CareerAbilityRepair\)') {
            throw 'CareerAbilityRepair replacement installer is not using the linked Harmony API and recovered callbacks.'
          }
          if ($careerBridge -notmatch 'campaign startup will continue without it') {
            throw 'CareerUniquesBridge startup-failure containment is missing.'
          }

          $resolver = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/HarmonyAssemblyResolver.cs' -Raw
          $runtimeSubmodule = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/SubModule.cs' -Raw
          $moduleXml = Get-Content 'module/SubModule.xml' -Raw

          if ($resolver -notmatch 'typeof\(Harmony\)\.Assembly') {
            throw 'Auxiliary Harmony resolver is not anchored to the linked 0Harmony assembly.'
          }
          if ($resolver -notmatch 'AssemblyResolve' -or $resolver -notmatch 'HarmonyLib\.Harmony, 0Harmony' -or $resolver -notmatch 'HarmonyLib\.HarmonyMethod, 0Harmony') {
            throw 'Auxiliary Harmony resolver does not validate the legacy sidecar lookup shape.'
          }

          $loadIndex = $runtimeSubmodule.IndexOf('OnSubModuleLoad')
          $gameStartIndex = $runtimeSubmodule.IndexOf('OnGameStart')
          $careerRepairIndex = $runtimeSubmodule.IndexOf('LinkedCareerAbilityRepairInstaller.Install();')
          $legacyCareerRepairIndex = $runtimeSubmodule.IndexOf('CareerAbilityRepair.Install();')
          $runtimeRepairIndex = $runtimeSubmodule.IndexOf('RuntimeRepair.Install();')
          $nativeCreationCompatibilityIndex = $runtimeSubmodule.IndexOf('NativeCreationCompatibility.Install();')
          if ($loadIndex -lt 0 -or $gameStartIndex -lt 0 -or $careerRepairIndex -lt 0 -or $runtimeRepairIndex -lt 0 -or $nativeCreationCompatibilityIndex -lt 0) {
            throw 'RuntimeCompatibility repair lifecycle surfaces are missing.'
          }
          if ($legacyCareerRepairIndex -ge 0) {
            throw 'The loader-sensitive recovered CareerAbilityRepair.Install() must not be invoked.'
          }
          if ($careerRepairIndex -lt $gameStartIndex -or $runtimeRepairIndex -lt $gameStartIndex -or $nativeCreationCompatibilityIndex -lt $gameStartIndex) {
            throw 'Recovered runtime/campaign/NativeCreation repairs must install at OnGameStart rather than early OnSubModuleLoad on affected Harmony 2.4 loader paths.'
          }
          foreach ($installer in @('RegisteredCareerAbilityPrerequisite.Install();','NativeCreationCompatibility.Install();','HarbingerAIControllerSafety.Install();','CompanionDialogueEligibilityRepair.Install();')) {
            if ($runtimeSubmodule -notmatch [regex]::Escape($installer)) {
              throw "Missing follow-up compatibility installer $installer"
            }
          }

          $careerPrerequisite = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/RegisteredCareerAbilityPrerequisite.cs' -Raw
          foreach ($surface in @('AbilityManagerMissionLogic','OnAgentCreated','IsRegisteredSharedHero','GetCareer','HasAttribute','AddAttribute','AbilityUser')) {
            if ($careerPrerequisite -notmatch [regex]::Escape($surface)) { throw "Missing registered-career prerequisite surface $surface" }
          }
          if ($careerPrerequisite -match 'IsAIControlled') {
            throw 'Registered career AbilityUser prerequisite must not depend on transient Agent.IsAIControlled state.'
          }

          $nativeCreationCompatibility = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/NativeCreationCompatibility.cs' -Raw
          foreach ($surface in @('FindCompatibleMethod','AddNonSerializedListener','Expression.Lambda','NativeCreation wrapper Start entered','NativeCreation legacy Start entered','AfterWrapperStart','AfterLegacyStart')) {
            if ($nativeCreationCompatibility -notmatch [regex]::Escape($surface)) { throw "Missing NativeCreation compatibility/diagnostic surface $surface" }
          }
          if ($nativeCreationCompatibility -notmatch 'MultiCharacterCampaignTOR\.NativeCreation\.Legacy\.dll') {
            throw 'NativeCreation compatibility does not target the packaged legacy bridge.'
          }

          $runtimeIndex = $moduleXml.IndexOf('MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll')
          $coreIndex = $moduleXml.IndexOf('MultiCharacterCampaignTOR.dll')
          $identityIndex = $moduleXml.IndexOf('MultiCharacterCampaignTOR.IdentityGuard.v140.dll')
          if ($runtimeIndex -lt 0 -or $coreIndex -lt 0 -or $identityIndex -lt 0 -or $runtimeIndex -gt $coreIndex -or $runtimeIndex -gt $identityIndex) {
            throw 'RuntimeCompatibility must remain the first MCC submodule so its compatibility guards can initialize before later MCC sidecars.'
          }
