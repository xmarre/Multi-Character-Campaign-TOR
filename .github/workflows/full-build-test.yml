name: Full reconstructed source build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Bannerlord references
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj

      - name: Resolve reference paths
        shell: pwsh
        run: |
          $campaign = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaign) { throw 'Bannerlord reference assemblies were not restored.' }
          $bin = $campaign.Directory.FullName
          $harmony = Get-ChildItem $bin -Filter 0Harmony.dll | Select-Object -First 1
          if (-not $harmony) {
            dotnet new classlib -n HarmonyResolver -o "$env:RUNNER_TEMP\HarmonyResolver" -f netstandard2.0
            dotnet add "$env:RUNNER_TEMP\HarmonyResolver\HarmonyResolver.csproj" package Lib.Harmony --version 2.3.3
            dotnet restore "$env:RUNNER_TEMP\HarmonyResolver\HarmonyResolver.csproj"
            $harmony = Get-ChildItem "$env:USERPROFILE\.nuget\packages\lib.harmony" -Recurse -Filter 0Harmony.dll | Where-Object FullName -Match 'netstandard2.0|net472|net48' | Select-Object -First 1
          }
          if (-not $harmony) { throw '0Harmony.dll was not resolved.' }
          "BANNERLORD_BIN=$bin" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HARMONY_DLL=$($harmony.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BannerlordBin=$bin"
          Write-Host "HarmonyDll=$($harmony.FullName)"

      - name: Build complete solution
        shell: pwsh
        run: |
          dotnet restore src/MultiCharacterCampaignTOR.CSharp.sln -p:BannerlordBin="$env:BANNERLORD_BIN" -p:HarmonyDll="$env:HARMONY_DLL" -p:RuntimeHarmonyDll="$env:HARMONY_DLL"
          dotnet build src/MultiCharacterCampaignTOR.CSharp.sln -c Release --no-restore -p:BannerlordBin="$env:BANNERLORD_BIN" -p:HarmonyDll="$env:HARMONY_DLL" -p:RuntimeHarmonyDll="$env:HARMONY_DLL"

      - name: Inventory outputs
        shell: pwsh
        run: |
          Get-ChildItem src -Recurse -Filter '*.dll' | Where-Object FullName -Match '\\bin\\Release\\' | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            Write-Host "$hash  $($_.FullName)"
          }
          $required = @(
            'src/MultiCharacterCampaignTOR/bin/Release/MultiCharacterCampaignTOR.dll',
            'src/NativeCreation/bin/Release/MultiCharacterCampaignTOR.NativeCreation.dll',
            'src/NativeCreation.Legacy/bin/Release/MultiCharacterCampaignTOR.NativeCreation.Legacy.dll',
            'src/RuntimeCompatibility/bin/Release/MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll',
            'src/SettlementPresence/bin/Release/MultiCharacterCampaignTOR.SettlementPresence.v141.dll',
            'src/IdentityGuard/bin/Release/MultiCharacterCampaignTOR.IdentityGuard.v140.dll'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing expected output: $path" } }

      - uses: actions/upload-artifact@v4
        with:
          name: full-module-v1.1.0
          path: |
            src/MultiCharacterCampaignTOR/bin/Release/MultiCharacterCampaignTOR.dll
            src/NativeCreation/bin/Release/MultiCharacterCampaignTOR.NativeCreation.dll
            src/NativeCreation.Legacy/bin/Release/MultiCharacterCampaignTOR.NativeCreation.Legacy.dll
            src/RuntimeCompatibility/bin/Release/MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll
            src/SettlementPresence/bin/Release/MultiCharacterCampaignTOR.SettlementPresence.v141.dll
            src/IdentityGuard/bin/Release/MultiCharacterCampaignTOR.IdentityGuard.v140.dll
          if-no-files-found: error
