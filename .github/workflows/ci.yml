name: Build and API validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore reference assemblies
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj

      - name: Inspect Bannerlord 1.3.15 battle APIs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $campaignDll = Get-ChildItem "$env:USERPROFILE\.nuget\packages\bannerlord.referenceassemblies\1.3.15.110062" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaignDll) { throw 'TaleWorlds.CampaignSystem.dll was not restored.' }
          $assemblyDir = $campaignDll.Directory.FullName
          [System.AppDomain]::CurrentDomain.add_AssemblyResolve({
            param($sender, $args)
            $name = (New-Object System.Reflection.AssemblyName($args.Name)).Name + '.dll'
            $candidate = Join-Path $assemblyDir $name
            if (Test-Path $candidate) { return [System.Reflection.Assembly]::LoadFrom($candidate) }
            return $null
          })
          $asm = [System.Reflection.Assembly]::LoadFrom($campaignDll.FullName)
          $flags = [System.Reflection.BindingFlags]'Public,NonPublic,Instance,Static'
          foreach ($spec in @(
            @('TaleWorlds.CampaignSystem.CampaignEventDispatcher','OnMapEventStarted'),
            @('TaleWorlds.CampaignSystem.CampaignEventDispatcher','OnMapEventEnded'),
            @('TaleWorlds.CampaignSystem.Encounters.PlayerEncounter','RestartPlayerEncounter'),
            @('TaleWorlds.CampaignSystem.Encounters.PlayerEncounter','Init'),
            @('TaleWorlds.CampaignSystem.Encounters.PlayerEncounter','Start')
          )) {
            $type = $asm.GetType($spec[0], $true)
            $methods = $type.GetMethods($flags) | Where-Object Name -eq $spec[1]
            if (-not $methods) { throw "Missing $($spec[0]).$($spec[1])" }
            foreach ($method in $methods) {
              $parameters = ($method.GetParameters() | ForEach-Object { "$($_.ParameterType.FullName) $($_.Name)" }) -join ', '
              Write-Host "$($method.ReturnType.FullName) $($type.FullName).$($method.Name)($parameters) static=$($method.IsStatic)"
            }
          }

      - name: Build intervention sidecar
        shell: pwsh
        run: dotnet build src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj -c Release --no-restore

      - name: Verify output
        shell: pwsh
        run: |
          $dll = 'src/IdentityGuard/bin/Release/MultiCharacterCampaignTOR.IdentityGuard.v140.dll'
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          Get-FileHash $dll -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: identityguard-v1.1.0
          path: src/IdentityGuard/bin/Release/MultiCharacterCampaignTOR.IdentityGuard.v140.dll
          if-no-files-found: error
