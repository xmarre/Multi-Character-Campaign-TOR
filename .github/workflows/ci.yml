name: Build and API validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Bannerlord references
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj

      - name: Resolve reference paths
        shell: pwsh
        run: |
          $campaign = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaign) { throw 'Bannerlord reference assemblies were not restored.' }
          $bin = $campaign.Directory.FullName
          $harmony = Get-ChildItem $bin -Filter 0Harmony.dll | Select-Object -First 1
          if (-not $harmony) {
            dotnet new classlib -n HarmonyResolver -o "$env:RUNNER_TEMP\HarmonyResolver" -f netstandard2.0
            dotnet add "$env:RUNNER_TEMP\HarmonyResolver\HarmonyResolver.csproj" package Lib.Harmony --version 2.3.3
            dotnet restore "$env:RUNNER_TEMP\HarmonyResolver\HarmonyResolver.csproj"
            $harmony = Get-ChildItem "$env:USERPROFILE\.nuget\packages\lib.harmony" -Recurse -Filter 0Harmony.dll | Where-Object FullName -Match 'netstandard2.0|net472|net48' | Select-Object -First 1
          }
          if (-not $harmony) { throw '0Harmony.dll was not resolved.' }
          "BANNERLORD_BIN=$bin" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HARMONY_DLL=$($harmony.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CAMPAIGN_DLL=$($campaign.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build complete solution
        shell: pwsh
        run: |
          dotnet restore src/MultiCharacterCampaignTOR.CSharp.sln -p:BannerlordBin="$env:BANNERLORD_BIN" -p:HarmonyDll="$env:HARMONY_DLL" -p:RuntimeHarmonyDll="$env:HARMONY_DLL"
          dotnet build src/MultiCharacterCampaignTOR.CSharp.sln -c Release --no-restore -p:BannerlordBin="$env:BANNERLORD_BIN" -p:HarmonyDll="$env:HARMONY_DLL" -p:RuntimeHarmonyDll="$env:HARMONY_DLL"

      - name: Inspect Bannerlord 1.3.15 finance, encounter, prediction, and roster APIs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $campaignDll = Get-Item $env:CAMPAIGN_DLL
          $assemblyDir = $campaignDll.Directory.FullName
          [System.AppDomain]::CurrentDomain.add_AssemblyResolve({
            param($sender, $args)
            $name = (New-Object System.Reflection.AssemblyName($args.Name)).Name + '.dll'
            $candidate = Join-Path $assemblyDir $name
            if (Test-Path $candidate) { return [System.Reflection.Assembly]::LoadFrom($candidate) }
            return $null
          })
          $asm = [System.Reflection.Assembly]::LoadFrom($campaignDll.FullName)
          $flags = [System.Reflection.BindingFlags]'Public,NonPublic,Instance,Static'
          foreach ($spec in @(
            @('TaleWorlds.CampaignSystem.CampaignEventDispatcher','OnMapEventStarted',3),
            @('TaleWorlds.CampaignSystem.CampaignEventDispatcher','OnPartyAddedToMapEvent',1),
            @('TaleWorlds.CampaignSystem.CampaignEventDispatcher','OnMapEventEnded',1),
            @('TaleWorlds.CampaignSystem.GameComponents.DefaultClanFinanceModel','AddIncomeFromParty',4),
            @('TaleWorlds.CampaignSystem.EncounterManager','RestartPlayerEncounter',2),
            @('TaleWorlds.CampaignSystem.Encounters.PlayerEncounter','RestartPlayerEncounter',3),
            @('TaleWorlds.CampaignSystem.Party.MobileParty','SetMoveEngageParty',2),
            @('TaleWorlds.CampaignSystem.MapEvents.MapEvent','GetStrengthsRelativeToParty',3),
            @('TaleWorlds.CampaignSystem.MapEvents.MapEvent','GetOtherSide',1),
            @('TaleWorlds.CampaignSystem.MapEvents.MapEvent','PartiesOnSide',1),
            @('TaleWorlds.CampaignSystem.Roster.TroopRoster','GetCharacterAtIndex',1),
            @('TaleWorlds.CampaignSystem.Roster.TroopRoster','GetElementNumber',1),
            @('TaleWorlds.CampaignSystem.Roster.TroopRoster','GetElementWoundedNumber',1),
            @('TaleWorlds.CampaignSystem.CharacterObject','GetFormationClass',0)
          )) {
            $type = $asm.GetType($spec[0], $true)
            $methods = @($type.GetMethods($flags) | Where-Object { $_.Name -eq $spec[1] -and $_.GetParameters().Length -eq $spec[2] })
            if (-not $methods) { throw "Missing $($spec[0]).$($spec[1])/$($spec[2])" }
            foreach ($method in $methods) {
              $parameters = ($method.GetParameters() | ForEach-Object { "$($_.ParameterType.FullName) $($_.Name)" }) -join ', '
              Write-Host "$($method.ReturnType.FullName) $($type.FullName).$($method.Name)($parameters) static=$($method.IsStatic)"
            }
          }
          $mobileParty = $asm.GetType('TaleWorlds.CampaignSystem.Party.MobileParty', $true)
          $engage = @($mobileParty.GetMethods($flags) | Where-Object { $_.Name -eq 'SetMoveEngageParty' -and $_.GetParameters().Length -eq 2 })
          if ($engage.Count -ne 1) { throw "Expected one SetMoveEngageParty(MobileParty, NavigationType), found $($engage.Count)." }
          $navigationType = $engage[0].GetParameters()[1].ParameterType
          if (-not $navigationType.IsEnum -or -not [Enum]::IsDefined($navigationType, 'Default')) { throw 'SetMoveEngageParty does not expose NavigationType.Default.' }
          $mapEvent = $asm.GetType('TaleWorlds.CampaignSystem.MapEvents.MapEvent', $true)
          $strength = @($mapEvent.GetMethods($flags) | Where-Object { $_.Name -eq 'GetStrengthsRelativeToParty' -and $_.GetParameters().Length -eq 3 })
          if ($strength.Count -ne 1 -or -not $strength[0].GetParameters()[1].ParameterType.IsByRef -or -not $strength[0].GetParameters()[2].ParameterType.IsByRef) { throw 'Native side-relative strength API has an unexpected signature.' }
          $partyBase = $asm.GetType('TaleWorlds.CampaignSystem.Party.PartyBase', $true)
          foreach ($property in @('Side','MemberRoster','NumberOfHealthyMembers','NumberOfWoundedTotalMembers','EstimatedStrength')) {
            if (-not $partyBase.GetProperty($property, $flags)) { throw "Missing PartyBase.$property" }
          }
          $character = $asm.GetType('TaleWorlds.CampaignSystem.CharacterObject', $true)
          foreach ($property in @('StringId','Name','Tier')) {
            if (-not $character.GetProperty($property, $flags)) { throw "Missing CharacterObject.$property" }
          }

      - name: Inspect MCC runtime patch surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shared = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/SharedPartyRuntimeFixes.cs' -Raw
          foreach ($surface in @('BeforeSynchronizeGold','AfterSynchronizeGold','BeforeAddIncomeFromParty','BeforeIsDefenderInMapEvent','AfterCanUseRemoteParty','AfterPartyAddedToMapEvent')) {
            if ($shared -notmatch [regex]::Escape($surface)) { throw "Missing runtime patch surface $surface" }
          }
          $flow = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionFlowFix.cs' -Raw
          foreach ($surface in @('BeforeShowInquiry','BeforeContinueBattleAsPlayer','HandleSelection','CanOrderPartyToBattle','EncounterManager','SetMoveEngageParty')) {
            if ($flow -notmatch [regex]::Escape($surface)) { throw "Missing validated battle-flow surface $surface" }
          }
          $settings = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionSettings.cs' -Raw
          foreach ($surface in @('tor_shared_campaign_alert_predicted_losses_only','AfterSyncData','AfterRegisterMenus','PredictedLossesOnly')) {
            if ($settings -notmatch [regex]::Escape($surface)) { throw "Missing battle-alert setting surface $surface" }
          }
          $prediction = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionPrediction.cs' -Raw
          foreach ($surface in @('GetStrengthsRelativeToParty','PartiesOnSide','PredictedLoss','FormationCounts','GetElementWoundedNumber','AfterPartyAddedToMapEvent','ShowPredictionInquiry')) {
            if ($prediction -notmatch [regex]::Escape($surface)) { throw "Missing prediction/composition surface $surface" }
          }
          $bridge = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionPredictionPriorityBridge.cs' -Raw
          foreach ($surface in @('BattleInterventionAlert','ShowInquiry','BeforeShowInquiry','priority.SetValue(harmonyPrefix, 800)')) {
            if ($bridge -notmatch [regex]::Escape($surface)) { throw "Missing priority bridge surface $surface" }
          }
          $submodule = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/SubModule.cs' -Raw
          foreach ($installer in @('RuntimeIdentityGuard.Install()','SharedPartyRuntimeFixes.Install()','BattleTakeoverSafetyGuard.Install()','BattleInterventionFlowFix.Install()','BattleInterventionSettings.Install()','BattleInterventionPrediction.Install()','BattleInterventionPredictionPriorityBridge.Install()')) {
            if ($submodule -notmatch [regex]::Escape($installer)) { throw "Missing installer $installer" }
          }
          $assemblyInfo = Get-Content 'src/IdentityGuard/Properties/AssemblyInfo.cs' -Raw
          if ($assemblyInfo -notmatch 'AssemblyVersion\("1\.2\.0\.0"\)') { throw 'IdentityGuard assembly version is not 1.2.0.0.' }
          $manifest = Get-Content 'module/SubModule.xml' -Raw
          if ($manifest -notmatch '<Version value="v1\.2\.0"') { throw 'Module manifest is not v1.2.0.' }

      - name: Inventory required outputs
        shell: pwsh
        run: |
          $required = @(
            'src/MultiCharacterCampaignTOR/bin/Release/MultiCharacterCampaignTOR.dll',
            'src/NativeCreation/bin/Release/MultiCharacterCampaignTOR.NativeCreation.dll',
            'src/NativeCreation.Legacy/bin/Release/MultiCharacterCampaignTOR.NativeCreation.Legacy.dll',
            'src/RuntimeCompatibility/bin/Release/MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll',
            'src/SettlementPresence/bin/Release/MultiCharacterCampaignTOR.SettlementPresence.v141.dll',
            'src/IdentityGuard/bin/Release/MultiCharacterCampaignTOR.IdentityGuard.v140.dll'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing expected output: $path" }
            Get-FileHash $path -Algorithm SHA256
          }

      - uses: actions/upload-artifact@v4
        with:
          name: full-module-v1.2.0
          path: |
            src/MultiCharacterCampaignTOR/bin/Release/MultiCharacterCampaignTOR.dll
            src/NativeCreation/bin/Release/MultiCharacterCampaignTOR.NativeCreation.dll
            src/NativeCreation.Legacy/bin/Release/MultiCharacterCampaignTOR.NativeCreation.Legacy.dll
            src/RuntimeCompatibility/bin/Release/MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll
            src/SettlementPresence/bin/Release/MultiCharacterCampaignTOR.SettlementPresence.v141.dll
            src/IdentityGuard/bin/Release/MultiCharacterCampaignTOR.IdentityGuard.v140.dll
          if-no-files-found: error
