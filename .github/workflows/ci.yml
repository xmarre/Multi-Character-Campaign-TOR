name: Build and API validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Bannerlord references
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj

      - name: Resolve reference paths
        shell: pwsh
        run: |
          $campaign = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaign) { throw 'Bannerlord reference assemblies were not restored.' }
          $bin = $campaign.Directory.FullName
          dotnet new classlib -n HarmonyResolver -o "$env:RUNNER_TEMP\HarmonyResolver" -f netstandard2.0
          dotnet add "$env:RUNNER_TEMP\HarmonyResolver\HarmonyResolver.csproj" package Lib.Harmony --version 2.3.3
          dotnet restore "$env:RUNNER_TEMP\HarmonyResolver\HarmonyResolver.csproj"
          $harmony = Get-ChildItem "$env:USERPROFILE\.nuget\packages\lib.harmony" -Recurse -Filter 0Harmony.dll | Where-Object FullName -Match 'net472' | Select-Object -First 1
          if (-not $harmony) { throw '0Harmony.dll was not resolved.' }
          "BANNERLORD_BIN=$bin" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HARMONY_DLL=$($harmony.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CAMPAIGN_DLL=$($campaign.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBRARY_DLL=$(Join-Path $bin 'TaleWorlds.Library.dll')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build complete solution
        shell: pwsh
        run: |
          dotnet restore src/MultiCharacterCampaignTOR.CSharp.sln -p:BannerlordBin="$env:BANNERLORD_BIN" -p:HarmonyDll="$env:HARMONY_DLL" -p:RuntimeHarmonyDll="$env:HARMONY_DLL"
          dotnet build src/MultiCharacterCampaignTOR.CSharp.sln -c Release --no-restore -p:BannerlordBin="$env:BANNERLORD_BIN" -p:HarmonyDll="$env:HARMONY_DLL" -p:RuntimeHarmonyDll="$env:HARMONY_DLL"

      - name: Inspect Bannerlord 1.3.15 APIs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $campaignDll = Get-Item $env:CAMPAIGN_DLL
          $assemblyDir = $campaignDll.Directory.FullName
          [System.AppDomain]::CurrentDomain.add_AssemblyResolve({
            param($sender, $args)
            $name = (New-Object System.Reflection.AssemblyName($args.Name)).Name + '.dll'
            $candidate = Join-Path $assemblyDir $name
            if (Test-Path $candidate) { return [System.Reflection.Assembly]::LoadFrom($candidate) }
            return $null
          })
          foreach ($dll in Get-ChildItem $assemblyDir -Filter '*.dll') { try { [void][System.Reflection.Assembly]::LoadFrom($dll.FullName) } catch {} }
          $asm = [System.Reflection.Assembly]::LoadFrom($campaignDll.FullName)
          $flags = [System.Reflection.BindingFlags]'Public,NonPublic,Instance,Static'

          function Require-Method($typeName, $methodName, $parameterCount) {
            $type = $asm.GetType($typeName, $true)
            $methods = @($type.GetMethods($flags) | Where-Object { $_.Name -eq $methodName -and $_.GetParameters().Length -eq $parameterCount })
            if (-not $methods) { throw "Missing $typeName.$methodName/$parameterCount" }
            foreach ($method in $methods) {
              $parameters = ($method.GetParameters() | ForEach-Object { "$($_.ParameterType.FullName) $($_.Name)" }) -join ', '
              Write-Host "$($method.ReturnType.FullName) $typeName.$methodName($parameters) static=$($method.IsStatic)"
            }
            return $methods
          }

          Require-Method 'TaleWorlds.CampaignSystem.CampaignEventDispatcher' 'OnMapEventStarted' 3 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.CampaignEventDispatcher' 'OnPartyAddedToMapEvent' 1 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.CampaignEventDispatcher' 'OnMapEventEnded' 1 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.GameComponents.DefaultClanFinanceModel' 'AddIncomeFromParty' 4 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.EncounterManager' 'RestartPlayerEncounter' 2 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.Party.MobileParty' 'SetMoveGoToPoint' 2 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.Party.MobileParty' 'OnPartyInteraction' 1 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.Party.MobileParty' 'SetMoveModeHold' 0 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.Party.MobilePartyAi' 'EnableAi' 0 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.Party.MobilePartyAi' 'SetDoNotMakeNewDecisions' 1 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.MapEvents.MapEvent' 'GetStrengthsRelativeToParty' 3 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.MapEvents.MapEvent' 'PartiesOnSide' 1 | Out-Null
          Require-Method 'TaleWorlds.CampaignSystem.GameMenus.GameMenu' 'ExitToLast' 0 | Out-Null

          $mobileParty = $asm.GetType('TaleWorlds.CampaignSystem.Party.MobileParty', $true)
          $goToPoint = @($mobileParty.GetMethods($flags) | Where-Object { $_.Name -eq 'SetMoveGoToPoint' -and $_.GetParameters().Length -eq 2 })
          if ($goToPoint.Count -ne 1) { throw "Expected one SetMoveGoToPoint/2 overload, found $($goToPoint.Count)." }
          $navigationType = $goToPoint[0].GetParameters()[1].ParameterType
          if (-not $navigationType.IsEnum -or -not [Enum]::IsDefined($navigationType, 'Default')) { throw 'SetMoveGoToPoint does not expose NavigationType.Default.' }
          if (-not $mobileParty.GetProperty('CurrentSettlement', $flags)) { throw 'MobileParty.CurrentSettlement is unavailable.' }

          $encounterModel = $asm.GetType('TaleWorlds.CampaignSystem.ComponentInterfaces.EncounterModel', $true)
          if (-not $encounterModel.GetProperty('NeededMaximumDistanceForEncounteringMobileParty', $flags)) { throw 'EncounterModel encounter-distance property is unavailable.' }

          $heroHelper = $asm.GetType('Helpers.HeroHelper', $true)
          $companionPredicate = @($heroHelper.GetMethods($flags) | Where-Object { $_.Name -eq 'IsCompanionInPlayerParty' -and $_.GetParameters().Length -eq 1 })
          if (-not $companionPredicate) { throw 'HeroHelper.IsCompanionInPlayerParty/1 is unavailable.' }

          $library = [System.Reflection.Assembly]::LoadFrom($env:LIBRARY_DLL)
          $information = $library.GetType('TaleWorlds.Library.InformationManager', $true)
          foreach ($spec in @(@('ShowTooltip',2),@('HideTooltip',0),@('ShowTextInquiry',3))) {
            $method = @($information.GetMethods($flags) | Where-Object { $_.Name -eq $spec[0] -and $_.GetParameters().Length -eq $spec[1] })
            if (-not $method) { throw "Missing InformationManager.$($spec[0])/$($spec[1])." }
          }
          $textInquiry = $library.GetType('TaleWorlds.Library.TextInquiryData', $true)
          if (-not @($textInquiry.GetConstructors($flags) | Where-Object { $_.GetParameters().Length -ge 10 })) { throw 'TextInquiryData configurable-input constructor is unavailable.' }

      - name: Inspect MCC v1.3.5 patch surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $threshold = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionThresholdPolicy.cs' -Raw
          foreach ($surface in @('tor_shared_campaign_alert_max_friendly_strength_share_percent','TextInquiryData','MaxFriendlyStrengthSharePercent','GetStrengthsRelativeToParty','AfterPartyAddedToMapEvent','Candidates')) {
            if ($threshold -notmatch [regex]::Escape($surface)) { throw "Missing threshold surface $surface" }
          }
          $reinforcement = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleReinforcementOrderGuard.cs' -Raw
          foreach ($surface in @('SetMoveGoToPoint','OnPartyInteraction','SetDoNotMakeNewDecisions','NeededMaximumDistanceForEncounteringMobileParty','BeforeOrderPartyToBattle','AfterMapEventEnded','Tick(float dt)')) {
            if ($reinforcement -notmatch [regex]::Escape($surface)) { throw "Missing reinforcement surface $surface" }
          }
          $settlementSwitch = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/SettlementCharacterSwitchMenuFix.cs' -Raw
          foreach ($surface in @('DispatchSelection','BeforeDispatchSelection','CurrentSettlement','GameMenu.ExitToLast','ReturnToSettlementAfterSwitch','Tick()')) {
            if ($settlementSwitch -notmatch [regex]::Escape($surface)) { throw "Missing settlement-switch surface $surface" }
          }
          $identitySubmodule = Get-Content 'src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/SubModule.cs' -Raw
          foreach ($surface in @('BattleInterventionThresholdPolicy.Install()','BattleReinforcementOrderGuard.Install()','BattleReinforcementOrderGuard.Tick(dt)','SettlementCharacterSwitchMenuFix.Install()','SettlementCharacterSwitchMenuFix.Tick()')) {
            if ($identitySubmodule -notmatch [regex]::Escape($surface)) { throw "Missing established installer/tick surface $surface" }
          }

          $runtimeSubmodule = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/SubModule.cs' -Raw
          foreach ($surface in @('HarmonyAssemblyResolver.Install()','LinkedCareerAbilityRepairInstaller.Install()','CareerButtonRefreshRepair.Install()','AICareerAbilitySupport.Install()','AICareerAbilityActivationContext.Install()','AICareerAbilityTransitionGuard.Install()','HarbingerAIControllerSafety.Install()','CompanionDialogueEligibilityRepair.Install()','RegisteredCareerAbilityPrerequisite.Install()','NativeCreationCompatibility.Install()')) {
            if ($runtimeSubmodule -notmatch [regex]::Escape($surface)) { throw "Missing v1.3.5 runtime compatibility installer surface $surface" }
          }
          if ($runtimeSubmodule -match 'CareerAbilityRepair\.Install\(\);') {
            throw 'The recovered loader-sensitive CareerAbilityRepair.Install() must not be called.'
          }
          $gameStart = $runtimeSubmodule.IndexOf('OnGameStart')
          $careerRepair = $runtimeSubmodule.IndexOf('LinkedCareerAbilityRepairInstaller.Install();')
          $runtimeRepair = $runtimeSubmodule.IndexOf('RuntimeRepair.Install();')
          if ($gameStart -lt 0 -or $careerRepair -lt $gameStart -or $runtimeRepair -lt $gameStart) {
            throw 'Recovered runtime/campaign repairs must install at OnGameStart rather than early OnSubModuleLoad.'
          }

          $linkedCareerRepair = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/LinkedCareerAbilityRepairInstaller.cs' -Raw
          foreach ($surface in @('typeof(CareerAbilityRepair)','new Harmony(','new HarmonyMethod(','ResolveAndCacheRuntimeMembers','_installed')) {
            if ($linkedCareerRepair -notmatch [regex]::Escape($surface)) { throw "Missing linked career-repair installer surface $surface" }
          }
          if ($linkedCareerRepair -match 'Type\.GetType\("HarmonyLib\.(Harmony|HarmonyMethod), 0Harmony"') { throw 'Linked career repair installer regressed to loader-sensitive Harmony lookup.' }

          $resolver = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/HarmonyAssemblyResolver.cs' -Raw
          foreach ($surface in @('typeof(Harmony).Assembly','AssemblyResolve','HarmonyLib.Harmony, 0Harmony','HarmonyLib.HarmonyMethod, 0Harmony')) {
            if ($resolver -notmatch [regex]::Escape($surface)) { throw "Missing auxiliary Harmony resolver surface $surface" }
          }

          $nativeCreation = Get-Content 'src/NativeCreation/MultiCharacterCampaignTOR/NativeCreation/NativeCharacterCreation.cs' -Raw
          if ($nativeCreation -match 'Type\.GetType\("HarmonyLib\.(Harmony|HarmonyMethod), 0Harmony"') { throw 'NativeCreation regressed to loader-sensitive Harmony lookup.' }
          foreach ($surface in @('typeof(Harmony)','typeof(HarmonyMethod)','new Harmony(HarmonyId)')) {
            if ($nativeCreation -notmatch [regex]::Escape($surface)) { throw "Missing NativeCreation linked-Harmony surface $surface" }
          }

          $careerPrerequisite = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/RegisteredCareerAbilityPrerequisite.cs' -Raw
          foreach ($surface in @('OnAgentCreated','AbilityUser','IsRegisteredSharedHero','GetCareer')) {
            if ($careerPrerequisite -notmatch [regex]::Escape($surface)) { throw "Missing registered-career prerequisite surface $surface" }
          }
          if ($careerPrerequisite -match 'IsAIControlled') { throw 'Registered-career AbilityUser prerequisite must not depend on transient IsAIControlled state.' }

          $nativeCreationCompatibility = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/NativeCreationCompatibility.cs' -Raw
          foreach ($surface in @('MultiCharacterCampaignTOR.NativeCreation.Legacy','AddNonSerializedListener','Action<object>','Delegate.CreateDelegate','NativeCreation wrapper Start entered','NativeCreation legacy Start entered')) {
            if ($nativeCreationCompatibility -notmatch [regex]::Escape($surface)) { throw "Missing NativeCreation compatibility surface $surface" }
          }

          $harbinger = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/HarbingerAIControllerSafety.cs' -Raw
          foreach ($surface in @('SummonChampionScript','ShiftControllerToChampion','ShiftControllerToCaster','AgentControllerType.AI','IsRegisteredSharedHeroAgent')) {
            if ($harbinger -notmatch [regex]::Escape($surface)) { throw "Missing Greater Harbinger AI safety surface $surface" }
          }

          $dialogue = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/CompanionDialogueEligibilityRepair.cs' -Raw
          foreach ($surface in @('ConversationSwitchCondition','HeroHelper.IsCompanionInPlayerParty','IsRegisteredSharedHero','MobileParty.MainParty')) {
            if ($dialogue -notmatch [regex]::Escape($surface)) { throw "Missing companion-dialogue repair surface $surface" }
          }

          $buttonRefresh = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/CareerButtonRefreshRepair.cs' -Raw
          foreach ($surface in @('TORBridge','RefreshAfterSwitch','GetCareerButton','Register','Disable','ViewModelInstance','RefreshValues')) {
            if ($buttonRefresh -notmatch [regex]::Escape($surface)) { throw "Missing career-button refresh surface $surface" }
          }

          $assemblyInfo = Get-Content 'src/IdentityGuard/Properties/AssemblyInfo.cs' -Raw
          if ($assemblyInfo -notmatch 'AssemblyVersion\("1\.3\.5\.0"\)' -or $assemblyInfo -notmatch 'AssemblyFileVersion\("1\.3\.5\.0"\)') {
            throw 'IdentityGuard assembly version is not 1.3.5.0.'
          }
          $manifest = Get-Content 'module/SubModule.xml' -Raw
          if ($manifest -notmatch '<Version value="v1\.3\.5"') { throw 'Module manifest is not v1.3.5.' }
          if (-not (Test-Path 'module/CHANGELOG-1.3.5.md')) { throw 'v1.3.5 changelog is missing.' }
          if (-not (Test-Path '.github/workflows/release-v1.3.5.yml')) { throw 'v1.3.5 release workflow is missing.' }

      - name: Inventory required outputs
        shell: pwsh
        run: |
          $required = @(
            'src/MultiCharacterCampaignTOR/bin/Release/MultiCharacterCampaignTOR.dll',
            'src/NativeCreation/bin/Release/MultiCharacterCampaignTOR.NativeCreation.dll',
            'src/NativeCreation.Legacy/bin/Release/MultiCharacterCampaignTOR.NativeCreation.Legacy.dll',
            'src/RuntimeCompatibility/bin/Release/MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll',
            'src/SettlementPresence/bin/Release/MultiCharacterCampaignTOR.SettlementPresence.v141.dll',
            'src/IdentityGuard/bin/Release/MultiCharacterCampaignTOR.IdentityGuard.v140.dll'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing expected output: $path" }
            Get-FileHash $path -Algorithm SHA256
          }

      - uses: actions/upload-artifact@v4
        with:
          name: full-module-v1.3.5
          path: |
            src/MultiCharacterCampaignTOR/bin/Release/MultiCharacterCampaignTOR.dll
            src/NativeCreation/bin/Release/MultiCharacterCampaignTOR.NativeCreation.dll
            src/NativeCreation.Legacy/bin/Release/MultiCharacterCampaignTOR.NativeCreation.Legacy.dll
            src/RuntimeCompatibility/bin/Release/MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll
            src/SettlementPresence/bin/Release/MultiCharacterCampaignTOR.SettlementPresence.v141.dll
            src/IdentityGuard/bin/Release/MultiCharacterCampaignTOR.IdentityGuard.v140.dll
          if-no-files-found: error
