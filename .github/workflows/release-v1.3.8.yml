name: Release v1.3.8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'xmarre/Multi-Character-Campaign-TOR' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v1.3.8]'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Bannerlord references
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj

      - name: Resolve build references
        shell: pwsh
        run: |
          $campaign = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaign) { throw 'Bannerlord reference assemblies were not restored.' }
          $bin = $campaign.Directory.FullName
          dotnet new classlib -n HarmonyResolver -o "$env:RUNNER_TEMP\HarmonyResolver" -f netstandard2.0
          dotnet add "$env:RUNNER_TEMP\HarmonyResolver\HarmonyResolver.csproj" package Lib.Harmony --version 2.3.3
          dotnet restore "$env:RUNNER_TEMP\HarmonyResolver\HarmonyResolver.csproj"
          $harmony = Get-ChildItem "$env:USERPROFILE\.nuget\packages\lib.harmony\2.3.3" -Recurse -Filter 0Harmony.dll | Where-Object FullName -Match 'net472' | Select-Object -First 1
          if (-not $harmony) { throw 'Lib.Harmony 2.3.3 0Harmony.dll was not resolved.' }
          "BANNERLORD_BIN=$bin" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HARMONY_DLL=$($harmony.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build complete module
        shell: pwsh
        run: |
          dotnet restore src/MultiCharacterCampaignTOR.CSharp.sln `
            -p:BannerlordBin="$env:BANNERLORD_BIN" `
            -p:HarmonyDll="$env:HARMONY_DLL" `
            -p:RuntimeHarmonyDll="$env:HARMONY_DLL"
          dotnet build src/MultiCharacterCampaignTOR.CSharp.sln -c Release --no-restore `
            -p:BannerlordBin="$env:BANNERLORD_BIN" `
            -p:HarmonyDll="$env:HARMONY_DLL" `
            -p:RuntimeHarmonyDll="$env:HARMONY_DLL"

      - name: Verify v1.3.8 release invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Get-Content 'module/SubModule.xml' -Raw
          if ($manifest -notmatch '<Version value="v1\.3\.8"') { throw 'Module manifest is not v1.3.8.' }

          $assemblyInfo = Get-Content 'src/IdentityGuard/Properties/AssemblyInfo.cs' -Raw
          if ($assemblyInfo -notmatch 'AssemblyVersion\("1\.3\.8\.0"\)' -or $assemblyInfo -notmatch 'AssemblyFileVersion\("1\.3\.8\.0"\)') {
            throw 'IdentityGuard assembly version is not 1.3.8.0.'
          }

          $runtimeSubmodule = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/SubModule.cs' -Raw
          foreach ($surface in @('NativeCreationMixedRaceCompatibility.Install()','MissileCastingTargetTransitionSafety.Install()')) {
            if ($runtimeSubmodule -notmatch [regex]::Escape($surface)) { throw "Missing v1.3.8 runtime installer surface $surface" }
          }

          $mixedRace = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/NativeCreationMixedRaceCompatibility.cs' -Raw
          foreach ($surface in @('_legacyInProgressField','_legacyCandidateHeroField','SetSelectedCulture','SelectedCulture','ReferenceEquals(Hero.MainHero, candidate)','candidate.Culture = selectedCulture')) {
            if ($mixedRace -notmatch [regex]::Escape($surface)) { throw "Missing v1.3.8 mixed-race creation surface $surface" }
          }
          $mixedRaceCode = (($mixedRace -split "`r?`n") | Where-Object { $_ -notmatch '^\s*///' }) -join "`n"
          if ($mixedRaceCode -match 'ApplyFinalEffects\s*\(') { throw 'v1.3.8 mixed-race repair must not execute ApplyFinalEffects.' }
          if ($mixedRaceCode -match 'Clan\.PlayerClan.*Culture\s*=') { throw 'v1.3.8 mixed-race repair must not replace player-clan culture.' }

          $missileSafety = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/MissileCastingTargetTransitionSafety.cs' -Raw
          foreach ($surface in @('MissileCastingBehavior','UpdateTarget','CurrentTarget','Formation','MakeGenericMethod','BeforeUpdateTarget','__result = __0','return false')) {
            if ($missileSafety -notmatch [regex]::Escape($surface)) { throw "Missing v1.3.8 missile transition-safety surface $surface" }
          }
          if ($missileSafety -match 'NullReferenceException' -or $missileSafety -match 'finalizer\s*:') {
            throw 'v1.3.8 missile transition repair must not use broad exception swallowing.'
          }

          if (-not (Test-Path 'module/CHANGELOG-1.3.8.md')) { throw 'v1.3.8 changelog is missing.' }
          if (-not (Test-Path 'RELEASE_NOTES.md')) { throw 'v1.3.8 release notes are missing.' }

      - name: Package and verify release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.3.8'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'mcc-release'
          $moduleRoot = Join-Path $releaseRoot 'Modules\MultiCharacterCampaignTOR'
          $binDir = Join-Path $moduleRoot 'bin\Win64_Shipping_Client'
          $sourceRoot = Join-Path $moduleRoot 'Source\CSharp'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'

          Remove-Item $releaseRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $binDir -ItemType Directory -Force | Out-Null
          New-Item $sourceRoot -ItemType Directory -Force | Out-Null
          New-Item $dist -ItemType Directory -Force | Out-Null

          foreach ($name in @('SubModule.xml','README.md','INSTALLATION.txt','SOURCE_INFO.md')) {
            $source = Join-Path 'module' $name
            if (-not (Test-Path $source)) { throw "Missing module metadata: $source" }
            Copy-Item $source (Join-Path $moduleRoot $name)
          }

          $releaseSection = (Get-Content 'module/CHANGELOG-1.3.8.md' -Raw).Trim()
          $history = Get-Content 'module/CHANGELOG.md' -Raw
          $history = [regex]::Replace($history, '^# Changelog\s*', '')
          "# Changelog`r`n`r`n$releaseSection`r`n`r`n$history" | Set-Content (Join-Path $moduleRoot 'CHANGELOG.md') -Encoding utf8

          $outputs = [ordered]@{
            'MultiCharacterCampaignTOR.dll' = 'src/MultiCharacterCampaignTOR/bin/Release/MultiCharacterCampaignTOR.dll'
            'MultiCharacterCampaignTOR.NativeCreation.dll' = 'src/NativeCreation/bin/Release/MultiCharacterCampaignTOR.NativeCreation.dll'
            'MultiCharacterCampaignTOR.NativeCreation.Legacy.dll' = 'src/NativeCreation.Legacy/bin/Release/MultiCharacterCampaignTOR.NativeCreation.Legacy.dll'
            'MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll' = 'src/RuntimeCompatibility/bin/Release/MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll'
            'MultiCharacterCampaignTOR.SettlementPresence.v141.dll' = 'src/SettlementPresence/bin/Release/MultiCharacterCampaignTOR.SettlementPresence.v141.dll'
            'MultiCharacterCampaignTOR.IdentityGuard.v140.dll' = 'src/IdentityGuard/bin/Release/MultiCharacterCampaignTOR.IdentityGuard.v140.dll'
          }

          $dllHashes = @()
          foreach ($entry in $outputs.GetEnumerator()) {
            if (-not (Test-Path $entry.Value)) { throw "Missing built assembly: $($entry.Value)" }
            $destination = Join-Path $binDir $entry.Key
            Copy-Item $entry.Value $destination
            $dllHashes += "{0}  {1}" -f (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant(), $entry.Key
          }
          $dllHashes | Set-Content (Join-Path $moduleRoot 'DLL-SHA256SUMS.txt') -Encoding utf8

          foreach ($tracked in (git ls-files src scripts module/CHANGELOG-1.3.8.md)) {
            if (-not (Test-Path $tracked -PathType Leaf)) { continue }
            $destination = Join-Path $sourceRoot $tracked
            New-Item (Split-Path $destination) -ItemType Directory -Force | Out-Null
            Copy-Item $tracked $destination
          }

          $zipName = "Multi-Character-Campaign-TOR-v$version-Bannerlord-1.3.15-TOR-WiTM-1.16.zip"
          $zipPath = Join-Path $dist $zipName
          Compress-Archive -Path (Join-Path $releaseRoot 'Modules') -DestinationPath $zipPath -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $required = @(
              'Modules/MultiCharacterCampaignTOR/SubModule.xml',
              'Modules/MultiCharacterCampaignTOR/CHANGELOG.md',
              'Modules/MultiCharacterCampaignTOR/DLL-SHA256SUMS.txt',
              'Modules/MultiCharacterCampaignTOR/bin/Win64_Shipping_Client/MultiCharacterCampaignTOR.dll',
              'Modules/MultiCharacterCampaignTOR/bin/Win64_Shipping_Client/MultiCharacterCampaignTOR.NativeCreation.dll',
              'Modules/MultiCharacterCampaignTOR/bin/Win64_Shipping_Client/MultiCharacterCampaignTOR.NativeCreation.Legacy.dll',
              'Modules/MultiCharacterCampaignTOR/bin/Win64_Shipping_Client/MultiCharacterCampaignTOR.RuntimeCompatibility.v140.dll',
              'Modules/MultiCharacterCampaignTOR/bin/Win64_Shipping_Client/MultiCharacterCampaignTOR.SettlementPresence.v141.dll',
              'Modules/MultiCharacterCampaignTOR/bin/Win64_Shipping_Client/MultiCharacterCampaignTOR.IdentityGuard.v140.dll'
            )
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\\','/') })
            foreach ($requiredEntry in $required) {
              if ($entries -notcontains $requiredEntry) { throw "Release archive is missing $requiredEntry" }
            }
            $manifestEntry = $archive.GetEntry('Modules/MultiCharacterCampaignTOR/SubModule.xml')
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try { $packagedManifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($packagedManifest -notmatch '<Version value="v1\.3\.8"') { throw 'Packaged SubModule.xml is not v1.3.8.' }
          }
          finally {
            $archive.Dispose()
          }

          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$zipPath.sha256"
          "$zipHash  $zipName" | Set-Content $checksumPath -Encoding ascii
          "RELEASE_ZIP=$zipPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$checksumPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release SHA256: $zipHash"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.3.8'
          if (gh release view $tag 2>$null) {
            throw "Release $tag already exists; refusing to replace an immutable release."
          }
          gh release create $tag "$env:RELEASE_ZIP" "$env:RELEASE_SHA" `
            --target "$env:GITHUB_SHA" `
            --title 'Multi-Character Campaign - TOR v1.3.8' `
            --notes-file RELEASE_NOTES.md `
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Multi-Character-Campaign-TOR-v1.3.8
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA }}
          if-no-files-found: error
