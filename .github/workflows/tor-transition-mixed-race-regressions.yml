name: TOR transition and mixed-race regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Bannerlord 1.3.15 references
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj

      - name: Verify Bannerlord deferred culture-commit surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $campaign = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaign) { throw 'TaleWorlds.CampaignSystem.dll was not restored.' }

          $assemblyDir = $campaign.Directory.FullName
          [System.AppDomain]::CurrentDomain.add_AssemblyResolve({
            param($sender, $args)
            $name = (New-Object System.Reflection.AssemblyName($args.Name)).Name + '.dll'
            $candidate = Join-Path $assemblyDir $name
            if (Test-Path $candidate) { return [System.Reflection.Assembly]::LoadFrom($candidate) }
            return $null
          })
          foreach ($dll in Get-ChildItem $assemblyDir -Filter '*.dll') { try { [void][System.Reflection.Assembly]::LoadFrom($dll.FullName) } catch {} }

          $assembly = [System.Reflection.Assembly]::LoadFrom($campaign.FullName)
          $flags = [System.Reflection.BindingFlags]'Public,NonPublic,Instance'
          $content = $assembly.GetType('TaleWorlds.CampaignSystem.CharacterCreationContent.CharacterCreationContent', $true)
          $manager = $assembly.GetType('TaleWorlds.CampaignSystem.CharacterCreationContent.CharacterCreationManager', $true)
          $hero = $assembly.GetType('TaleWorlds.CampaignSystem.Hero', $true)

          $setSelectedCulture = $content.GetMethods($flags) | Where-Object Name -eq 'SetSelectedCulture'
          if (@($setSelectedCulture).Count -ne 1) { throw 'Expected exactly one CharacterCreationContent.SetSelectedCulture surface.' }
          $selectedCulture = $content.GetProperty('SelectedCulture', $flags)
          if (-not $selectedCulture -or -not $selectedCulture.CanRead) { throw 'CharacterCreationContent.SelectedCulture is unavailable.' }
          if (-not ($content.GetMethods($flags) | Where-Object Name -eq 'ApplyCulture')) { throw 'CharacterCreationContent.ApplyCulture is unavailable.' }
          if (-not ($manager.GetMethods($flags) | Where-Object Name -eq 'ApplyFinalEffects')) { throw 'CharacterCreationManager.ApplyFinalEffects is unavailable.' }

          $cultureField = $hero.GetField('Culture', [System.Reflection.BindingFlags]'Public,Instance')
          if (-not $cultureField) { throw 'Hero.Culture is no longer a public field; re-audit the narrow culture commit.' }
          if ($cultureField.FieldType.FullName -ne 'TaleWorlds.CampaignSystem.CultureObject') {
            throw "Unexpected Hero.Culture field type: $($cultureField.FieldType.FullName)"
          }

          Write-Host 'Confirmed Bannerlord selected-culture, deferred ApplyCulture/ApplyFinalEffects, and Hero.Culture surfaces.'

      - name: Guard NativeCreation mixed-race transaction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/NativeCreationMixedRaceCompatibility.cs'
          $source = Get-Content $path -Raw

          foreach ($surface in @(
            '_legacyInProgressField',
            '_legacyCandidateHeroField',
            'SetSelectedCulture',
            'SelectedCulture',
            'ReferenceEquals(Hero.MainHero, candidate)',
            'candidate.Culture = selectedCulture',
            'before TOR race resolution'
          )) {
            if ($source -notmatch [regex]::Escape($surface)) { throw "Missing mixed-race compatibility surface: $surface" }
          }

          if ($source -match 'ApplyFinalEffects\s*\(') { throw 'Mixed-race repair must not run Bannerlord campaign-start ApplyFinalEffects.' }
          if ($source -match 'Clan\.PlayerClan.*Culture\s*=') { throw 'Mixed-race repair must not replace the persistent player-clan culture.' }

          $submodule = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/SubModule.cs' -Raw
          if ($submodule -notmatch 'NativeCreationMixedRaceCompatibility\.Install\(\)') { throw 'Mixed-race compatibility installer is not wired.' }

      - name: Guard TOR missile transition null-state repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/MissileCastingTargetTransitionSafety.cs'
          $source = Get-Content $path -Raw

          foreach ($surface in @(
            'MissileCastingBehavior',
            'UpdateTarget',
            'CurrentTarget',
            'Formation',
            'TOR_Core.BattleMechanics.AI.CommonAIFunctions.Target',
            'GuardTargetStateTranspiler',
            'OpCodes.Ldarg_1',
            'OpCodes.Ret'
          )) {
            if ($source -notmatch [regex]::Escape($surface)) { throw "Missing missile transition guard surface: $surface" }
          }

          if ($source -match 'NullReferenceException') { throw 'Missile transition repair must not broadly swallow NullReferenceException.' }
          if ($source -match 'finalizer\s*:') { throw 'Missile transition repair must guard the invalid state before native dereferences.' }

          $submodule = Get-Content 'src/RuntimeCompatibility/MultiCharacterCampaignTOR/RuntimeCompatibility/SubModule.cs' -Raw
          if ($submodule -notmatch 'MissileCastingTargetTransitionSafety\.Install\(\)') { throw 'Missile transition safety installer is not wired.' }
