name: Recover staged repository

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.1.0-battle-intervention
          fetch-depth: 0

      - name: Recover complete XZ blocks from compact payload
        shell: bash
        run: |
          set -euo pipefail
          encoded=/tmp/mcc-final.tar.xz.b64
          payload=/tmp/mcc-final.tar.xz
          tarball=/tmp/mcc-final.tar
          out=/tmp/mcc-materialized

          cat .bootstrap/final-payload.tar.xz.b64/part-*.txt | tr -d '\r\n' > "$encoded"
          base64 --decode "$encoded" > "$payload"
          echo "payload bytes=$(wc -c < "$payload")"

          set +e
          xz --decompress --stdout "$payload" > "$tarball"
          xz_status=$?
          set -e
          echo "xz status=$xz_status; recovered tar bytes=$(wc -c < "$tarball")"
          test -s "$tarball"

          mkdir -p "$out"
          set +e
          tar --extract --file="$tarball" --directory="$out" --ignore-zeros
          tar_status=$?
          set -e
          echo "tar status=$tar_status"

          find "$out" -maxdepth 8 -type f | sort | sed -n '1,300p'

          test -f "$out/module/SubModule.xml"
          test -f "$out/module/CHANGELOG.md"
          test -f "$out/scripts/package_release.py"
          test -f "$out/src/MultiCharacterCampaignTOR.CSharp.sln"
          test -f "$out/src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj"
          test -f "$out/src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionAlert.cs"
          test -f "$out/src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/RemotePartySwitch.cs"
          test -f "$out/src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/RuntimeIdentityGuard.cs"
          test -s "$out/src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionAlert.cs"
          grep -E 'MapEvent|map event' "$out/src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionAlert.cs" >/dev/null
          grep -E 'Take|control|command|reinforc' "$out/src/IdentityGuard/MultiCharacterCampaignTOR/IdentityGuard/BattleInterventionAlert.cs" >/dev/null

          rsync -a --delete --exclude='.git/' "$out/" "$GITHUB_WORKSPACE/"
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'Recovery produced no changes'; exit 1; }
          git commit -m "Materialize v1.1.0 source and release pipeline"
          git push origin HEAD:agent/v1.1.0-battle-intervention
