name: Inspect native party UI APIs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Bannerlord references
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj
      - name: Inspect UI types
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $campaign = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaign) { throw 'Bannerlord reference package missing.' }
          $dir = $campaign.Directory.FullName
          [System.AppDomain]::CurrentDomain.add_AssemblyResolve({
            param($sender, $args)
            $name = (New-Object System.Reflection.AssemblyName($args.Name)).Name + '.dll'
            $candidate = Join-Path $dir $name
            if (Test-Path $candidate) { return [System.Reflection.Assembly]::LoadFrom($candidate) }
            return $null
          })
          $assemblies = @()
          foreach ($dll in Get-ChildItem $dir -Filter '*.dll') {
            try { $assemblies += [System.Reflection.Assembly]::LoadFrom($dll.FullName) } catch {}
          }
          $flags = [System.Reflection.BindingFlags]'Public,NonPublic,Instance,Static'
          $patterns = 'PartyTooltip|TroopTooltip|PartyScreenManager|InquiryElementVM|MultiSelectionInquiry|MapMobileParty|PartyInfo|PartyVM|TroopVM|Tooltip'
          foreach ($asm in $assemblies) {
            $types = @()
            try { $types = $asm.GetTypes() } catch { $types = $_.Exception.Types | Where-Object { $_ } }
            foreach ($type in $types | Where-Object { $_.FullName -match $patterns }) {
              Write-Host "===== $($asm.GetName().Name) :: $($type.FullName) ====="
              foreach ($ctor in $type.GetConstructors($flags)) {
                $params = ($ctor.GetParameters() | ForEach-Object { "$($_.ParameterType.FullName) $($_.Name)" }) -join ', '
                Write-Host "CTOR ($params)"
              }
              foreach ($property in $type.GetProperties($flags)) { Write-Host "PROPERTY $($property.PropertyType.FullName) $($property.Name)" }
              foreach ($method in $type.GetMethods($flags) | Where-Object { $_.DeclaringType -eq $type }) {
                $params = ($method.GetParameters() | ForEach-Object { "$($_.ParameterType.FullName) $($_.Name)" }) -join ', '
                Write-Host "METHOD $($method.ReturnType.FullName) $($method.Name)($params) static=$($method.IsStatic)"
              }
            }
          }
