name: Inspect native party UI APIs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Bannerlord references
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj
      - name: Resolve native hint tooltip call chain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $campaign = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaign) { throw 'Bannerlord reference package missing.' }
          $dir = $campaign.Directory.FullName
          [System.AppDomain]::CurrentDomain.add_AssemblyResolve({
            param($sender, $args)
            $name = (New-Object System.Reflection.AssemblyName($args.Name)).Name + '.dll'
            $candidate = Join-Path $dir $name
            if (Test-Path $candidate) { return [System.Reflection.Assembly]::LoadFrom($candidate) }
            return $null
          })
          $assemblies = @{}
          foreach ($dll in Get-ChildItem $dir -Filter '*.dll') {
            try {
              $asm = [System.Reflection.Assembly]::LoadFrom($dll.FullName)
              $assemblies[$asm.GetName().Name] = $asm
            } catch {}
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Reflection;
          using System.Reflection.Emit;
          public static class ILCallDumper
          {
              private static readonly Dictionary<short, OpCode> Codes = BuildCodes();
              private static Dictionary<short, OpCode> BuildCodes()
              {
                  var result = new Dictionary<short, OpCode>();
                  foreach (var field in typeof(OpCodes).GetFields(BindingFlags.Public | BindingFlags.Static))
                  {
                      if (field.FieldType == typeof(OpCode))
                      {
                          var opcode = (OpCode)field.GetValue(null);
                          result[opcode.Value] = opcode;
                      }
                  }
                  return result;
              }
              public static void Dump(MethodBase method)
              {
                  Console.WriteLine("===== IL CALLS " + method.DeclaringType.FullName + "." + method.Name + " =====");
                  var body = method.GetMethodBody();
                  if (body == null) { Console.WriteLine("NO BODY"); return; }
                  var bytes = body.GetILAsByteArray();
                  int index = 0;
                  while (index < bytes.Length)
                  {
                      int offset = index;
                      short value = bytes[index++];
                      if (value == 0xFE) value = (short)(0xFE00 | bytes[index++]);
                      OpCode opcode;
                      if (!Codes.TryGetValue(value, out opcode)) throw new InvalidOperationException("Unknown opcode at " + offset);
                      int token = 0;
                      switch (opcode.OperandType)
                      {
                          case OperandType.InlineNone: break;
                          case OperandType.ShortInlineBrTarget:
                          case OperandType.ShortInlineI:
                          case OperandType.ShortInlineVar: index += 1; break;
                          case OperandType.InlineVar: index += 2; break;
                          case OperandType.InlineI:
                          case OperandType.InlineBrTarget:
                          case OperandType.ShortInlineR:
                          case OperandType.InlineField:
                          case OperandType.InlineMethod:
                          case OperandType.InlineSig:
                          case OperandType.InlineString:
                          case OperandType.InlineTok:
                          case OperandType.InlineType:
                              token = BitConverter.ToInt32(bytes, index); index += 4; break;
                          case OperandType.InlineI8:
                          case OperandType.InlineR: index += 8; break;
                          case OperandType.InlineSwitch:
                              int count = BitConverter.ToInt32(bytes, index); index += 4 + count * 4; break;
                          default: throw new InvalidOperationException("Unhandled operand " + opcode.OperandType);
                      }
                      if (opcode.OperandType == OperandType.InlineMethod || opcode.OperandType == OperandType.InlineField || opcode.OperandType == OperandType.InlineType || opcode.OperandType == OperandType.InlineTok)
                      {
                          try
                          {
                              var member = method.Module.ResolveMember(token, method.DeclaringType == null ? null : method.DeclaringType.GetGenericArguments(), method.IsGenericMethod ? method.GetGenericArguments() : null);
                              Console.WriteLine(offset.ToString("X4") + " " + opcode.Name + " -> " + member.DeclaringType.FullName + "." + member.Name + " :: " + member);
                          }
                          catch (Exception ex)
                          {
                              Console.WriteLine(offset.ToString("X4") + " " + opcode.Name + " token=0x" + token.ToString("X8") + " resolve failed: " + ex.Message);
                          }
                      }
                  }
              }
          }
          '@
          $flags = [System.Reflection.BindingFlags]'Public,NonPublic,Instance,Static'
          function Dump-Method([string]$assemblyName, [string]$typeName, [string]$methodName) {
            $type = $assemblies[$assemblyName].GetType($typeName, $true)
            $method = $type.GetMethods($flags) | Where-Object { $_.Name -eq $methodName } | Select-Object -First 1
            if (-not $method) { throw "Missing $typeName.$methodName" }
            [ILCallDumper]::Dump($method)
          }
          Dump-Method 'TaleWorlds.Core.ViewModelCollection' 'TaleWorlds.Core.ViewModelCollection.Information.HintViewModel' 'ExecuteBeginHint'
          Dump-Method 'TaleWorlds.Core.ViewModelCollection' 'TaleWorlds.Core.ViewModelCollection.Information.HintViewModel' 'ExecuteEndHint'
          Dump-Method 'TaleWorlds.Core.ViewModelCollection' 'TaleWorlds.Core.ViewModelCollection.Information.BasicTooltipViewModel' 'ExecuteBeginHint'
          Dump-Method 'TaleWorlds.Core.ViewModelCollection' 'TaleWorlds.Core.ViewModelCollection.Information.BasicTooltipViewModel' 'ExecuteEndHint'
          Dump-Method 'TaleWorlds.CampaignSystem.ViewModelCollection' 'TaleWorlds.CampaignSystem.ViewModelCollection.GameMenu.Recruitment.RecruitVolunteerTroopVM' 'ExecuteBeginHint'
