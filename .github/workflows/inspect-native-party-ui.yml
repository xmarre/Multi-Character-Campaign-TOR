name: Inspect native party UI APIs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore Bannerlord references
        shell: pwsh
        run: dotnet restore src/IdentityGuard/MultiCharacterCampaignTOR.IdentityGuard.v140.csproj
      - name: Inspect exact tooltip and menu APIs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $campaign = Get-ChildItem "$env:USERPROFILE\.nuget\packages" -Recurse -Filter TaleWorlds.CampaignSystem.dll | Select-Object -First 1
          if (-not $campaign) { throw 'Bannerlord reference package missing.' }
          $dir = $campaign.Directory.FullName
          [System.AppDomain]::CurrentDomain.add_AssemblyResolve({
            param($sender, $args)
            $name = (New-Object System.Reflection.AssemblyName($args.Name)).Name + '.dll'
            $candidate = Join-Path $dir $name
            if (Test-Path $candidate) { return [System.Reflection.Assembly]::LoadFrom($candidate) }
            return $null
          })
          $assemblies = @{}
          foreach ($dll in Get-ChildItem $dir -Filter '*.dll') {
            try {
              $asm = [System.Reflection.Assembly]::LoadFrom($dll.FullName)
              $assemblies[$asm.GetName().Name] = $asm
            } catch {}
          }
          $flags = [System.Reflection.BindingFlags]'Public,NonPublic,Instance,Static'
          function Print-Type([string]$assemblyName, [string]$typeName, [string]$methodFilter) {
            $asm = $assemblies[$assemblyName]
            if (-not $asm) { Write-Host "MISSING ASSEMBLY $assemblyName"; return }
            $type = $asm.GetType($typeName, $false)
            if (-not $type) { Write-Host "MISSING TYPE $assemblyName :: $typeName"; return }
            Write-Host "===== $assemblyName :: $typeName ====="
            foreach ($property in $type.GetProperties($flags)) {
              if (-not $methodFilter -or $property.Name -match $methodFilter) {
                Write-Host "PROPERTY $($property.PropertyType.FullName) $($property.Name) get=$($property.CanRead) set=$($property.CanWrite)"
              }
            }
            foreach ($method in $type.GetMethods($flags) | Where-Object { $_.DeclaringType -eq $type }) {
              if ($methodFilter -and $method.Name -notmatch $methodFilter) { continue }
              $params = ($method.GetParameters() | ForEach-Object { "$($_.ParameterType.FullName) $($_.Name)" }) -join ', '
              Write-Host "METHOD $($method.ReturnType.FullName) $($method.Name)($params) static=$($method.IsStatic)"
            }
          }
          Print-Type 'TaleWorlds.Core' 'TaleWorlds.Core.InformationManager' 'Tooltip|Inquiry|Hint'
          Print-Type 'TaleWorlds.Core' 'TaleWorlds.Core.MBInformationManager' 'Tooltip|Inquiry|Hint'
          Print-Type 'TaleWorlds.CampaignSystem' 'TaleWorlds.CampaignSystem.GameMenus.GameMenu' 'SwitchToMenu|ExitToLast|StringId|Current'
          Print-Type 'TaleWorlds.CampaignSystem' 'TaleWorlds.CampaignSystem.GameMenus.GameMenuManager' 'LastGameMenu|Current|Menu'
          Print-Type 'TaleWorlds.CampaignSystem' 'TaleWorlds.CampaignSystem.Campaign' 'CurrentMenuContext|GameMenuManager|Current'
          Print-Type 'TaleWorlds.CampaignSystem' 'TaleWorlds.CampaignSystem.GameMenus.MenuContext' 'GameMenu|Current'
          Print-Type 'TaleWorlds.Core.ViewModelCollection' 'TaleWorlds.Core.ViewModelCollection.Information.HintViewModel' 'ExecuteBeginHint|ExecuteEndHint'
          Print-Type 'TaleWorlds.CampaignSystem.ViewModelCollection' 'TaleWorlds.CampaignSystem.ViewModelCollection.TooltipRefresherCollection' 'RefreshMapEventTooltip|AddEncounterParties'
